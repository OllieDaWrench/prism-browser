<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Prism — a new home for browser tools, apps, games and feedback." />
    <title>Prism — Home</title>
    <style>
      :root {
        color-scheme: dark;
        --gold: #e2b657;
        --ink: #0d0d0f;
        --panel: rgba(24, 25, 30, 0.92);
        --line: #343039;
        --muted: #a6a1a9;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px 18px;
        color: #f4f0e8;
        background: radial-gradient(900px 620px at 50% -12%, #322714 0%, #151418 48%, var(--ink) 80%);
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .home { width: min(100%, 760px); }
      header { margin-bottom: 30px; text-align: center; }
      .mark {
        width: 54px; height: 54px; display: grid; place-items: center; margin: 0 auto 14px;
        border: 1px solid #725d31; border-radius: 17px; background: #201b12;
        color: var(--gold); font-size: 27px; font-weight: 750; box-shadow: 0 12px 45px #0007;
      }
      h1 { margin: 0; font-size: clamp(36px, 8vw, 54px); letter-spacing: -0.045em; }
      .tagline { margin: 8px 0 0; color: var(--muted); }
      .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .tile {
        min-height: 142px; display: flex; flex-direction: column; justify-content: space-between;
        padding: 20px; border: 1px solid var(--line); border-radius: 17px;
        background: var(--panel); color: inherit; text-align: left; text-decoration: none;
        font: inherit; cursor: pointer;
        transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
      }
      a.tile:hover, a.tile:focus-visible { transform: translateY(-2px); border-color: var(--gold); background: #211e1a; outline: none; }
      .tile[aria-disabled="true"], .tile:disabled { color: #77747a; background: #141418; cursor: not-allowed; }
      button.tile { appearance: none; }
      button.tile:disabled { opacity: 1; }
      .icon { color: var(--gold); font-size: 25px; line-height: 1; }
      [aria-disabled="true"] .icon { color: #77747a; }
      .tile-title { display: block; margin-top: 17px; font-size: 18px; font-weight: 680; }
      .tile-note { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
      [aria-disabled="true"] .tile-note { color: #77747a; }
      footer { margin-top: 24px; color: #817d85; font-size: 12px; text-align: center; }
      footer a { color: #aaa5ad; }
      @media (max-width: 520px) {
        .tiles { grid-template-columns: 1fr; gap: 10px; }
        .tile { min-height: 106px; padding: 17px; }
        .tile-title { margin-top: 12px; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; } }
    </style>
  </head>
  <body>
    <main class="home">
      <header>
        <div class="mark" aria-hidden="true">P</div>
        <h1>Prism</h1>
        <p class="tagline">Choose where you want to go.</p>
      </header>

      <nav class="tiles" aria-label="Prism sections">
        <a class="tile" href="/app">
          <span class="icon" aria-hidden="true">◉</span>
          <span><span class="tile-title">Web Browser</span><span class="tile-note">Open the Prism browser</span></span>
        </a>
        <a class="tile" href="/apps.html">
          <span class="icon" aria-hidden="true">▦</span>
          <span><span class="tile-title">Apps</span><span class="tile-note">Explore apps in Prism</span></span>
        </a>
        <button class="tile" type="button" disabled aria-disabled="true" title="Games are not available yet">
          <span class="icon" aria-hidden="true">▶</span>
          <span><span class="tile-title">Games</span><span class="tile-note">Coming later</span></span>
        </button>
        <a class="tile" href="/feedback.html">
          <span class="icon" aria-hidden="true">✉</span>
          <span><span class="tile-title">Feedback</span><span class="tile-note">Send a note to the Prism team</span></span>
        </a>
      </nav>

      <footer>Prism 3.0.0 · <a href="/login">Admin sign-in</a></footer>
    </main>
  </body>
</html>
