<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Prism — Web Browser</title>
    <style>
      :root { color-scheme: dark; --gold: #e2b657; --ink: #0d0d0f; --muted: #a6a1a9; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(850px 550px at 50% -10%, #322714, var(--ink) 74%); color: #f4f0e8; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 500px); padding: 30px; border: 1px solid #343039; border-radius: 20px; background: #18191e; text-align: center; }
      .badge { color: var(--gold); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 10px 0; font-size: 32px; }
      p { color: var(--muted); }
      a { color: var(--gold); }
      .actions { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 22px; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Web Browser</span>
      <h1>Under construction</h1>
      <p>The Prism browser is under construction. This section is available to Prism administrators.</p>
      <div class="actions"><a href="/">Back to home</a><a href="/login">Admin sign-in</a></div>
    </main>
  </body>
</html>
