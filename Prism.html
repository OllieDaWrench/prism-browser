<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prism</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23181c24'/%3E%3Cpath d='M8 22 L16 6 L24 22 Z' fill='none' stroke='%23e2b657' stroke-width='2'/%3E%3Cpath d='M11 16 H21' stroke='%23e2b657' stroke-width='2'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #101218;
        --chrome: #181c24;
        --line: #2c3340;
        --text: #e8e6e1;
        --muted: #9aa3b2;
        --gold: #e2b657;
        --gold-dim: #b8892e;
        --field: #0d1016;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .shell {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .chrome {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: var(--chrome);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 12px;
        color: var(--gold);
        padding: 0 6px;
      }
      .controls,
      .chrome > button {
        display: flex;
        gap: 4px;
      }
      button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        cursor: pointer;
      }
      .chrome button {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        color: var(--muted);
        display: grid;
        place-items: center;
      }
      .chrome button:hover:not(:disabled) {
        background: #222836;
        color: var(--text);
      }
      .chrome button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .chrome svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #omnibox {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 12px;
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 999px;
      }
      #omnibox svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.8;
        stroke-linecap: round;
      }
      #url {
        flex: 1;
        height: 100%;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font: inherit;
      }
      #progress {
        height: 2px;
        background: linear-gradient(90deg, var(--gold-dim), var(--gold));
        transform-origin: left;
        animation: load 1.1s ease infinite;
      }
      #progress[hidden] {
        display: none;
      }
      @keyframes load {
        0% {
          transform: scaleX(0.1);
          opacity: 0.5;
        }
        50% {
          transform: scaleX(0.7);
          opacity: 1;
        }
        100% {
          transform: scaleX(1);
          opacity: 0.2;
        }
      }
      main {
        flex: 1;
        position: relative;
        min-height: 0;
      }
      #view {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      #view[hidden],
      #start[hidden] {
        display: none;
      }
      #start {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(900px 420px at 50% -10%, #2a2416 0%, transparent 70%), var(--bg);
      }
      .kicker {
        margin: 0 0 8px;
        color: var(--gold);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 11px;
      }
      #start h1 {
        margin: 0 0 22px;
        font-size: 36px;
        font-weight: 650;
      }
      #start-form {
        width: min(560px, 100%);
        display: flex;
        gap: 8px;
        padding: 6px;
        background: var(--chrome);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      #start-q {
        flex: 1;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        padding: 10px 12px;
      }
      #start-form button {
        background: var(--gold);
        color: #1a1408;
        font-weight: 700;
        border-radius: 12px;
        padding: 0 16px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }
      .chips button {
        border: 1px solid var(--line);
        background: var(--chrome);
        color: var(--muted);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 13px;
      }
      .chips button:hover {
        color: var(--text);
        border-color: #3d4658;
      }
      #ver {
        position: fixed;
        right: 10px;
        bottom: 8px;
        z-index: 50;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--muted);
        background: rgba(16, 18, 24, 0.8);
        padding: 3px 8px;
        border-radius: 6px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="chrome">
        <div class="brand">Prism</div>
        <div class="controls">
          <button type="button" id="back" title="Back" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5.5 8 12l7.5 6.5" /></svg>
          </button>
          <button type="button" id="fwd" title="Forward" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5 16 12l-7.5 6.5" /></svg>
          </button>
          <button type="button" id="reload" title="Reload">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.2-5.5" />
              <path d="M20 5v5h-5" />
            </svg>
          </button>
        </div>
        <form id="omnibox" autocomplete="off">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input id="url" name="q" placeholder="Search Google or enter address" spellcheck="false" />
        </form>
        <button type="button" id="home" title="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 11.5 12 4l8 7.5" />
            <path d="M7 10.5V20h10v-9.5" />
          </svg>
        </button>
      </header>
      <div id="progress" hidden></div>
      <main>
        <section id="start">
          <p class="kicker">Browse through Prism</p>
          <h1>Search Google from here</h1>
          <form id="start-form" autocomplete="off">
            <input id="start-q" placeholder="Search Google or enter a site" spellcheck="false" />
            <button type="submit">Go</button>
          </form>
          <div class="chips">
            <button type="button" data-go="https://www.youtube.com/">YouTube</button>
            <button type="button" data-go="https://chatgpt.com/">ChatGPT</button>
            <button type="button" data-go="https://poki.com/">Poki</button>
          </div>
        </section>
        <iframe id="view" title="Page" hidden></iframe>
      </main>
    </div>
    <div id="ver">1.16.0</div>
    <script>
      const iframe = document.getElementById("view");
      const start = document.getElementById("start");
      const urlInput = document.getElementById("url");
      const progress = document.getElementById("progress");
      const backBtn = document.getElementById("back");
      const fwdBtn = document.getElementById("fwd");
      const reloadBtn = document.getElementById("reload");
      const homeBtn = document.getElementById("home");

      const stack = [];
      let index = -1;
      let browsing = false;

      function looksLikeUrl(raw) {
        return /^(https?:\/\/)/i.test(raw) || /^[\w.-]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(raw);
      }

      function withIgu(url) {
        try {
          const u = new URL(url);
          u.searchParams.set("igu", "1");
          return u.href;
        } catch {
          return url;
        }
      }

      function isGoogle(url) {
        try {
          const host = new URL(url).hostname.replace(/^www\./, "");
          return host === "google.com" || host.endsWith(".google.com");
        } catch {
          return false;
        }
      }

      function toFrame(raw) {
        const value = raw.trim();
        if (!value) return null;
        if (/^https?:\/\//i.test(value) || looksLikeUrl(value)) {
          const url = /^https?:\/\//i.test(value) ? value : "https://" + value;
          if (isGoogle(url)) {
            try {
              const u = new URL(url);
              if (u.pathname === "/" || u.pathname === "") u.pathname = "/webhp";
              return withIgu(u.href);
            } catch {
              return withIgu(url);
            }
          }
          return (
            "/r/" +
            btoa(unescape(encodeURIComponent(url)))
              .replace(/\+/g, "-")
              .replace(/\//g, "_")
              .replace(/=+$/g, "")
          );
        }
        return withIgu("https://www.google.com/search?q=" + encodeURIComponent(value));
      }

      function toDisplay(raw) {
        const value = raw.trim();
        if (!value) return "";
        if (/^https?:\/\//i.test(value)) return value;
        if (looksLikeUrl(value)) return "https://" + value;
        return "https://www.google.com/search?q=" + encodeURIComponent(value);
      }

      function updateNav() {
        backBtn.disabled = index <= 0;
        fwdBtn.disabled = index < 0 || index >= stack.length - 1;
      }

      function setLoading(on) {
        progress.hidden = !on;
      }

      function showBrowser() {
        browsing = true;
        start.hidden = true;
        iframe.hidden = false;
      }

      function goHome() {
        browsing = false;
        iframe.hidden = true;
        iframe.removeAttribute("src");
        start.hidden = false;
        urlInput.value = "";
        setLoading(false);
        updateNav();
        document.getElementById("start-q").focus();
      }

      function go(raw, { push = true } = {}) {
        const src = toFrame(raw);
        if (!src) return;
        urlInput.value = toDisplay(raw);
        showBrowser();
        setLoading(true);
        iframe.src = src;
        if (push) {
          stack.splice(index + 1);
          stack.push(raw);
          index = stack.length - 1;
        }
        updateNav();
      }

      document.getElementById("omnibox").addEventListener("submit", (e) => {
        e.preventDefault();
        go(urlInput.value);
      });

      document.getElementById("start-form").addEventListener("submit", (e) => {
        e.preventDefault();
        go(document.getElementById("start-q").value);
      });

      document.querySelectorAll("[data-go]").forEach((btn) => {
        btn.addEventListener("click", () => go(btn.getAttribute("data-go")));
      });

      backBtn.addEventListener("click", () => {
        if (index <= 0) return;
        index -= 1;
        go(stack[index], { push: false });
      });

      fwdBtn.addEventListener("click", () => {
        if (index >= stack.length - 1) return;
        index += 1;
        go(stack[index], { push: false });
      });

      reloadBtn.addEventListener("click", () => {
        if (!browsing || index < 0) return;
        go(stack[index], { push: false });
      });

      homeBtn.addEventListener("click", goHome);
      iframe.addEventListener("load", () => setLoading(false));
      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "prism-go" && e.data.url) go(e.data.url);
        if (e.data && e.data.type === "prism-url" && e.data.url) urlInput.value = e.data.url;
      });
      updateNav();
    </script>
  </body>
</html>
